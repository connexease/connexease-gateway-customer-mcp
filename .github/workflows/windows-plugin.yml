name: Windows plugin verification

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        working-directory: plugins/connexease-gateway-ops
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: plugins/connexease-gateway-ops/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run probe
      - run: node scripts/probe.mjs dist/server.mjs
